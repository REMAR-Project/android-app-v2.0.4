apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.github.hintofbasil.crabbler"
        minSdkVersion 16
        targetSdkVersion 35
        versionCode 35
        versionName "2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def keystorePath = file("release.keystore")
    signingConfigs {
        release {
            if (keystorePath.exists()) {
                storeFile keystorePath
                storePassword System.getenv("STORE_PASSWORD") ?: "walk13"
                keyAlias System.getenv("KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("KEY_PASSWORD") ?: "walk13"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    namespace 'com.github.hintofbasil.crabbler'

    configurations.all {
        resolutionStrategy {
            force 'androidx.fragment:fragment:1.2.5'
            force 'androidx.activity:activity:1.2.4'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.fragment:fragment:1.2.5'
    implementation 'androidx.activity:activity:1.2.4'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.roomorama:caldroid:3.0.1'
    implementation 'me.grantland:autofittextview:0.2.+'
    implementation 'com.android.volley:volley:1.2.1'

}